name: SMZDM 好价监控

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# 修复这里的并发配置，为 group 加上单引号
concurrency:
  group: 'smzdm-scan'
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # 从缓存恢复 SQLite 数据库
      - name: Restore database cache
        id: cache-db
        uses: actions/cache/restore@v4
        with:
          path: smzdm.db
          key: smzdm-db-${{ github.run_id }}
          restore-keys: |
            smzdm-db-

      - name: Run scraper
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: python smzdm.py

      # 保存 SQLite 数据库到缓存 (无论成功失败都保存，以便保留进度)
      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: smzdm.db
          key: smzdm-db-${{ github.run_id }}
