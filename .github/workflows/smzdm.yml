name: SMZDM 好价监控 NEW

on:
  # 由 cron-job.org 每 15 分钟触发。不要再叠加 GitHub schedule，避免重复扫描。
  workflow_dispatch:
    inputs:
      debug_article_id:
        description: '可选：查询指定文章 ID 的候选快照和推送历史'
        required: false
        type: string
  repository_dispatch:
    types: [cron_trigger]

permissions:
  contents: write

concurrency:
  group: smzdm-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          SMZDM_UNITTEST: '1'
        run: python -m unittest -v

      - name: Remove files created by unit tests
        if: always()
        run: rm -f smzdm.db smzdm-ops-alerted

      # 从缓存恢复 SQLite 数据库。key 含 run_id，实际命中靠 restore-keys 前缀。
      - name: Restore database cache
        id: cache-db
        uses: actions/cache/restore@v5
        with:
          path: smzdm.db
          key: smzdm-db-${{ github.run_id }}
          restore-keys: |
            smzdm-db-

      # 缓存被逐出时，从只保存数据库的 smzdm-state 分支恢复。两者都没有则本轮只建库不推送。
      - name: Restore durable database
        id: durable-db
        run: |
          set -euo pipefail
          if [[ -s smzdm.db ]]; then
            echo "source=cache" >> "$GITHUB_OUTPUT"
            echo "SMZDM_STATE_RESTORED=1" >> "$GITHUB_ENV"
            echo "Restored smzdm.db from Actions cache"
            exit 0
          fi
          restored=0
          if git fetch --depth=1 origin smzdm-state; then
            if git cat-file -e FETCH_HEAD:smzdm.db; then
              git show FETCH_HEAD:smzdm.db > smzdm.db
              if python - <<'PY'
          import sqlite3
          import sys
          conn = sqlite3.connect("smzdm.db")
          row = conn.execute("PRAGMA integrity_check").fetchone()
          conn.close()
          sys.exit(0 if row and row[0] == "ok" else 1)
          PY
              then
                restored=1
              else
                echo "smzdm-state database failed integrity check"
                rm -f smzdm.db
              fi
            fi
          fi
          if [[ "$restored" == "1" ]]; then
            echo "source=branch" >> "$GITHUB_OUTPUT"
            echo "SMZDM_STATE_RESTORED=1" >> "$GITHUB_ENV"
            echo "Restored smzdm.db from smzdm-state"
          else
            echo "source=none" >> "$GITHUB_OUTPUT"
            echo "SMZDM_STATE_RESTORED=0" >> "$GITHUB_ENV"
            echo "No prior database. This run records state and does not push."
          fi

      - name: Diagnose requested article
        if: ${{ inputs.debug_article_id != '' }}
        env:
          DEBUG_ARTICLE_ID: ${{ inputs.debug_article_id }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
        run: |
          if [[ ! "$DEBUG_ARTICLE_ID" =~ ^[0-9]+$ ]]; then
            echo "debug_article_id must contain digits only"
            exit 1
          fi
          # 诊断在 scraper 之前执行，先兼容旧缓存的表结构，包含关键词冷却表。
          python - <<'PY'
          from smzdm import SmzdmScraper
          scraper = SmzdmScraper()
          scraper._cleanup()
          PY
          echo "Candidate snapshots for article $DEBUG_ARTICLE_ID:"
          sqlite3 -header -column smzdm.db "
            SELECT article_id, item_key, title, worthy, collection,
                   comments, unworthy, score_rate, composite_score,
                   age_hours, captured_at
            FROM candidate_snapshots
            WHERE article_id = '$DEBUG_ARTICLE_ID'
            ORDER BY captured_at;
          "
          echo "Matching successful-push history:"
          sqlite3 -header -column smzdm.db "
            SELECT id, title, fingerprint, product_key, mall, price,
                   price_value, last_seen
            FROM history
            WHERE id = '$DEBUG_ARTICLE_ID'
               OR fingerprint IN (
                    SELECT fingerprint
                    FROM candidate_snapshots
                    WHERE article_id = '$DEBUG_ARTICLE_ID'
                      AND fingerprint IS NOT NULL AND fingerprint != ''
               )
               OR product_key IN (
                    SELECT product_key
                    FROM candidate_snapshots
                    WHERE article_id = '$DEBUG_ARTICLE_ID'
                      AND product_key IS NOT NULL AND product_key != ''
               )
            ORDER BY last_seen DESC;
          "
          if sqlite3 smzdm.db "
            SELECT COUNT(*) FROM sqlite_master
            WHERE type = 'table' AND name = 'late_recheck_state';
          " | grep -q '^1$'; then
            echo "Late-recheck state for article:"
            sqlite3 -header -column smzdm.db "
              SELECT article_id, last_checked, retired
              FROM late_recheck_state
              WHERE article_id = '$DEBUG_ARTICLE_ID';
            "
            echo "Next eligible late-recheck rows:"
            python - <<'PY'
          import os
          from smzdm import SmzdmScraper

          scraper = SmzdmScraper()
          rows = scraper._select_late_recheck_rows(set(), 100000)
          target = os.environ["DEBUG_ARTICLE_ID"]
          target_position = next(
              (position for position, row in enumerate(rows, start=1)
               if row["article_id"] == target),
              None,
          )
          print(f"eligible={len(rows)} target_position={target_position or '-'}")
          for position, row in enumerate(rows[:20], start=1):
              print(
                  f"{position:>3} id={row['article_id']} score={row['composite_score']} "
                  f"comments={row['comments']} collection={row['collection']} "
                  f"worthy={row['worthy']} captured={row['captured_at']} "
                  f"title={row['title']}"
              )
          scraper._cleanup()
          PY
          fi

      - name: Run scraper
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          WXPUSHER_BACKUP_UID: ${{ secrets.WXPUSHER_BACKUP_UID }}
          WXPUSHER_BACKUP_APP_TOKEN: ${{ secrets.WXPUSHER_BACKUP_APP_TOKEN }}
        run: python smzdm.py

      # 保存 SQLite 数据库到缓存 (无论成功失败都保存，以便保留进度)
      - name: Save database cache
        if: always() && hashFiles('smzdm.db') != ''
        uses: actions/cache/save@v5
        with:
          path: smzdm.db
          key: smzdm-db-${{ github.run_id }}

      # 专用分支只保留最新一份数据库，避免每 15 分钟把二进制历史堆进主分支。
      - name: Publish durable database
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMZDM_STATE_TOKEN: ${{ secrets.SMZDM_STATE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! -s smzdm.db ]]; then
            echo "No database file to publish"
            exit 0
          fi
          python - <<'PY'
          import sqlite3
          conn = sqlite3.connect("smzdm.db")
          row = conn.execute("PRAGMA integrity_check").fetchone()
          conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          conn.commit()
          conn.close()
          if not row or row[0] != "ok":
              raise SystemExit("refusing to publish a database that failed integrity_check")
          PY
          export TOKEN="${SMZDM_STATE_TOKEN:-${GITHUB_TOKEN:-}}"
          if [[ -z "$TOKEN" ]]; then
            echo "No token available to publish smzdm-state"
            exit 1
          fi
          work=$(mktemp -d)
          askpass=$(mktemp)
          cleanup() {
            rm -rf "$work"
            rm -f "$askpass"
          }
          trap cleanup EXIT
          cp smzdm.db "$work/smzdm.db"
          git -C "$work" init -b smzdm-state
          git -C "$work" add smzdm.db
          git -C "$work" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            -c user.name="github-actions[bot]" \
            commit -m "Update SMZDM monitor state"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *[Uu]sername*) printf '%s\n' "x-access-token" ;;
            *) printf '%s\n' "$TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C "$work" push --force \
            "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:smzdm-state

      - name: Alert on workflow failure
        if: failure()
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          WXPUSHER_BACKUP_UID: ${{ secrets.WXPUSHER_BACKUP_UID }}
          WXPUSHER_BACKUP_APP_TOKEN: ${{ secrets.WXPUSHER_BACKUP_APP_TOKEN }}
        run: python -c "from smzdm import send_workflow_failure_alert; send_workflow_failure_alert('GitHub Actions 步骤失败')"
